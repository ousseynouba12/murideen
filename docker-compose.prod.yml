services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Pas de port exposé publiquement : uniquement accessible depuis le réseau interne Docker.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Pas de port exposé publiquement.

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Exposé pour être placé derrière un sous-domaine Cloudflare (ex. api.votre-domaine.com),
    # nécessaire car le frontend appelle l'API directement depuis le navigateur (NEXT_PUBLIC_API_URL).

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://backend:8080
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "80:3000"
    # Placez Cloudflare (proxy + TLS) devant ce service sur le VPS.

volumes:
  db_data:
