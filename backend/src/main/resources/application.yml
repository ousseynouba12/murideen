spring:
  application:
    name: murideen-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:murideen}
    username: ${DB_USER:murideen}
    password: ${DB_PASSWORD:changeme_demo_password}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  mail:
    host: ${SMTP_HOST:smtp.mailtrap.io}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

murideen:
  jwt:
    secret: ${JWT_SECRET:demo_super_secret_key_change_me_in_production_min_32_chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${PUBLIC_SITE_URL:http://localhost:3000}
  mail:
    from: ${SMTP_FROM:Murideen <boutique@murideen-demo.com>}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:murideen-media-demo}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      public-base-url: ${R2_PUBLIC_BASE_URL:http://localhost:8080/media}
  payment:
    provider: ${PAYMENT_PROVIDER:CINETPAY}
    cinetpay:
      api-key: ${CINETPAY_API_KEY:}
      site-id: ${CINETPAY_SITE_ID:}
      secret-key: ${CINETPAY_SECRET_KEY:}
    paydunya:
      master-key: ${PAYDUNYA_MASTER_KEY:}
      private-key: ${PAYDUNYA_PRIVATE_KEY:}
      public-key: ${PAYDUNYA_PUBLIC_KEY:}
      token: ${PAYDUNYA_TOKEN:}
  frontend:
    revalidate-url: ${PUBLIC_SITE_URL:http://localhost:3000}/api/revalidate
    revalidate-secret: ${JWT_SECRET:demo_super_secret_key_change_me_in_production_min_32_chars}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

logging:
  level:
    com.murideen: INFO
